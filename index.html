<style>

.tck:hover{border-color:var(--teal)}.tck:active{transform:scale(.88)}.isdone .tck,.leaving .tck{background:var(--green);border-color:var(--green)}
.tmain{min-width:0;display:grid;gap:2px}.tmain .tt{font-weight:500;overflow-wrap:anywhere}.tmain .tm{font-size:12px;color:var(--mute)}
.dd.late{color:var(--red);font-weight:700}.dd.today{color:var(--orange);font-weight:700}.dd.soon{color:var(--teal);font-weight:600}
.tside{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tside select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 6px;font-size:12px;color:var(--mute)}
.stbtn{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff;cursor:pointer}.stbtn.s0{background:var(--mute)}.stbtn.s1{background:var(--orange)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--rc,var(--teal));color:#fff;font-size:10px;font-weight:700}
@media(max-width:600px){.trow{grid-template-columns:28px minmax(0,1fr)}.tside{grid-column:2;justify-content:flex-start}}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start;margin-top:4px}@media(max-width:700px){.kanban{grid-template-columns:1fr}}
.kcol{background:color-mix(in srgb,var(--line) 40%,#fff);border:2px solid transparent;border-radius:14px;padding:8px;min-height:110px;transition:border-color .15s,background .15s}.kcol.over{border-color:var(--teal);background:#e3f0ee}
.kcol h3{margin:2px 4px 8px;font-size:13px;color:var(--navy)}.kcol h3 span{color:var(--mute);font-weight:400}
.kc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(16,48,58,.06)}
.kc.late{border-left-color:var(--red)}.kc.today{border-left-color:var(--orange)}.kc.soon{border-left-color:var(--teal)}.kc.drag{opacity:.4}
.kc b{display:block;font-weight:500;margin-bottom:4px}.kc .kf{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}.kc select{border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px;background:#fff}
.empty{padding:22px 14px;color:var(--mute);text-align:center}
main.fresh{animation:fin .2s ease}@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{transition:transform .12s,box-shadow .15s}.card:not(.static):active{transform:scale(.99)}
.tab{transition:background .15s,color .15s}
.trow.nock{grid-template-columns:minmax(0,1fr) auto}.tmain[data-open],.tmain[data-lopen],.tmain[data-iopen]{cursor:pointer}
@media(max-width:600px){.trow.nock{grid-template-columns:minmax(0,1fr)}.trow.nock .tside{grid-column:1}}
.tlist .alert{border:0;border-left:4px solid var(--red);border-radius:0;margin:0;border-bottom:1px solid var(--line)}
.tlist .tt .pill{margin-left:6px;vertical-align:1px}
h2.sec{font-size:15px;margin:18px 0 8px}
.hdw{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--navy),var(--navy2))}.hdw .bar{position:static;background:none}
.mainnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 8px;background:rgba(0,0,0,.16);-webkit-overflow-scrolling:touch}.mainnav::-webkit-scrollbar{display:none}
.mainnav button{flex:none;white-space:nowrap;border:0;background:none;color:#C9D8DD;font-weight:600;font-size:14px;padding:12px 12px 9px;border-bottom:4px solid transparent;cursor:pointer;transition:color .15s}
.mainnav button:hover{color:#fff}.mainnav button.on{color:#fff;border-bottom-color:var(--orange)}
.mainnav .cnt{display:inline-block;min-width:18px;text-align:center;font-size:11px;border-radius:999px;padding:1px 6px;margin-left:4px;background:rgba(255,255,255,.2);color:#fff}.mainnav .cnt.new{background:var(--orange)}
.tform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}.tform .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mute);min-width:0}.fld .field,.fld textarea{font-weight:400;color:var(--ink)}
.fld a{font-weight:600;color:var(--teal);margin-left:6px}.fld.rb{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap}.fld.rb .btn{flex:1 1 140px}
.fil{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;margin-bottom:10px}
.bub{display:flex;gap:8px;align-items:flex-start}.bub>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex:1;min-width:0}
.mention{background:#FDE9D6;color:#B4530A;font-weight:600;border-radius:6px;padding:0 4px}.mention.mm{background:var(--orange);color:#fff}.mwrap{position:relative}.mpop{position:absolute;left:0;right:0;bottom:100%;z-index:6;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(16,40,58,.18);max-height:220px;overflow-y:auto;margin-bottom:4px}.mpop button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:inherit;cursor:pointer}.mpop button.on,.mpop button:hover{background:#F3F6F6}.mpop small{color:var(--mute)}
.bub.me>div{background:#EAF3F2;border-color:#cfe2e0}.bub .bh{font-size:12px}.bub .bt{white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast hide"></div>
<script src="config.js"></script>
<script>
/* ===== Utilitaires ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'op-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const fmtDate=d=>{const [y,m,j]=d.split('-');return j+'/'+m};
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),ms)}
function pill(st){const c={'À affecter':'red','Affecté':'orange','En cours':'orange','Terminé':'green','Ouverte':'red','Planifiée':'orange','Clôturée':'green','À faire':'red','Faite':'green'}[st]||'grey';return `<span class="pill p-${c}">${esc(st)}</span>`}

/* ===== Stockage local (IndexedDB) : session + file d'attente ===== */
const DB={db:null,
  open(){return new Promise((ok,ko)=>{try{const r=indexedDB.open('cockpit',1);r.onupgradeneeded=()=>{r.result.createObjectStore('queue',{keyPath:'k',autoIncrement:true});r.result.createObjectStore('kv')};r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>ko(r.error)}catch(e){ko(e)}})},
  tx(store,mode,fn){return new Promise((ok,ko)=>{const t=this.db.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)})},
  get(k){return this.db?this.tx('kv','readonly',s=>s.get(k)):Promise.resolve(null)},
  set(k,v){return this.db?this.tx('kv','readwrite',s=>s.put(v,k)):Promise.resolve()},
  del(k){return this.db?this.tx('kv','readwrite',s=>s.delete(k)):Promise.resolve()},
  clearKv(){return this.db?this.tx('kv','readwrite',s=>s.clear()):Promise.resolve()},
  add(op){return this.db?this.tx('queue','readwrite',s=>s.add(op)):Promise.reject(new Error('Stockage local indisponible'))},
  all(){return this.db?this.tx('queue','readonly',s=>s.getAll()):Promise.resolve([])},
  remove(k){return this.tx('queue','readwrite',s=>s.delete(k))}
};

/* ===== Appels serveur ===== */
const API_URL=window.COCKPIT_API||'https://script.google.com/macros/s/AKfycbzrb2truwSvmcabRrfYlxm2xemE54lthTCfiegbmIM1fFoJzHX4786cqMUdi3n5hbxaRA/exec';
async function server(fn,...args){const r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const S={token:null,me:null,view:'list',data:null,detail:null,pending:0,online:navigator.onLine,flushing:false,localPhotos:{},filter:'Tous',tab:'Calendrier'};

/* File d'attente : toute écriture passe par ici. Rien n'est perdu sans réseau ; chaque opération est rejouée avec le même opId (dédoublonnée côté serveur). */
async function enqueue(action,payload){
  const op={opId:uuid(),action,payload,by:S.me.id,at:Date.now()};
  await DB.add(op); await refreshPending(); flush(); return op;
}
async function refreshPending(){S.pending=S.me?(await DB.all()).filter(o=>o.by===S.me.id).length:0;paintNet()}
async function flush(){
  if(S.flushing||!S.token)return; S.flushing=true;
  try{
    // Seules les saisies de la personne connectée sont rejouées : jamais sous le nom de quelqu'un d'autre.
    for(const op of (await DB.all()).filter(o=>o.by===S.me.id)){
      let r;
      try{r=await server('api',S.token,{opId:op.opId,action:op.action,payload:op.payload})}
      catch(e){S.online=false;paintNet();break}               // réseau : on garde tout et on réessaiera
      S.online=true;
      if(r.ok){await DB.remove(op.k)}
      else if(r.session){await logout(true);toast('Session expirée : saisissez votre code, vos saisies sont conservées',5000);break}
      else{await DB.remove(op.k);toast('Refusé : '+r.error,4500)}  // erreur logique : inutile de rejouer
      await refreshPending();
    }
  }finally{S.flushing=false;await refreshPending()}
  if(S.token&&S.pending===0&&S.view==='list')loadList(true);
}
window.addEventListener('online',()=>{S.online=true;paintNet();flush()});
window.addEventListener('offline',()=>{S.online=false;paintNet()});
setInterval(()=>{if(S.token&&S.pending>0)flush()},20000);

function paintNet(){const e=$('#net');if(!e)return;const off=!S.online||!navigator.onLine;
  e.className='net'+(off||S.pending?' off':'');e.textContent=off?('Hors ligne'+(S.pending?' · '+S.pending+' en attente':'')):(S.pending?S.pending+' à envoyer':'Synchronisé')}

/* ===== Photos : prises sur le téléphone, compressées avant envoi ===== */
function compress(file,max=1280,q=.7){return new Promise((ok,ko)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>ko(new Error('Photo illisible'));img.src=u})}
function pickPhoto(){return new Promise(ok=>{const i=document.createElement('input');i.type='file';i.accept='image/'+String.fromCharCode(42);i.capture='environment';
  i.onchange=async()=>{if(!i.files[0])return ok(null);try{ok(await compress(i.files[0]))}catch(e){toast(e.message);ok(null)}};i.click()})}

/* ===== Connexion ===== */
async function logout(){S.token=null;S.me=null;S.data=null;S.detail=null;S.localPhotos={};S.tab='Calendrier';S.filter='Tous';await DB.del('session');const s=$('#sheet');if(s)s.remove();render()}
async function doLogin(){
  const code=$('#code').value.trim();if(!code)return;$('#lbtn').disabled=true;$('#err').textContent='';
  let r;
  try{r=await server('login',code)}catch(e){$('#err').textContent='Pas de réseau : connexion impossible';$('#lbtn').disabled=false;return}
  if(!r.ok){$('#err').textContent=r.error;$('#lbtn').disabled=false;return}
  const last=await DB.get('lastUser');
  if(last!==r.me.id)await DB.clearKv();                 // autre personne sur cet appareil : on repart de zéro
  await DB.set('lastUser',r.me.id);
  S.token=r.token;S.me=r.me;S.data=null;await DB.set('session',{token:r.token,me:r.me,at:Date.now()});
  S.view='list';await refreshPending();render();loadList();flush()
}

/* ===== Chargement ===== */
async function loadList(silent){
  if(!S.token)return;
  const action=S.me.role==='Gestion'?'listMenages':S.me.role==='Ménage'?'myMenages':S.me.role==='Jardin et entretien'?'myInterventions':null;
  if(!action){S.data={menages:[],today:'',logements:[]};render();return}
  try{const r=await server('api',S.token,{action,payload:{}});
    if(r.ok){S.data=r.data;S.online=true;await DB.set('cache',{role:S.me.role,data:r.data})}
    else if(r.session){await logout(true);return}
    else toast(r.error)
  }catch(e){S.online=false;const c=await DB.get('cache');if(c&&c.role===S.me.role)S.data=c.data;if(!silent)toast('Hors ligne : dernière liste connue')}
  if(S.view==='list')render();paintNet()
}

/* ===== Rendu ===== */
function render(){
  const app=$('#app');
  if(!S.token){app.innerHTML=`<div class="login"><h1>Cockpit Conciergerie</h1><p class="mute">Saisissez votre code personnel</p>
    <input id="code" type="password" autocomplete="off" autocapitalize="characters" placeholder="Votre code"><div class="err" id="err"></div>
    <button class="btn big" id="lbtn">Entrer</button></div>`;
    $('#lbtn').onclick=doLogin;$('#code').onkeydown=e=>{if(e.key==='Enter')doLogin()};return}

  P.slice().sort((a,b)=>b.nom.length-a.nom.length).forEach(p=>{const tag='@'+p.nom.toLowerCase();let i=low.indexOf(tag);while(i>=0){const nx=low.charAt(i+tag.length);if(!/[a-z0-9@À-ſ]/.test(low.charAt(i-1))&&(nx===''||!/[a-z0-9\u00c0-\u017f]/.test(nx))){if(!out.includes(p.id))out.push(p.id);low=low.slice(0,i)+' '.repeat(tag.length)+low.slice(i+tag.length);break}i=low.indexOf(tag,i+1)}});return out}
const mentionedMe=k=>k.statut!=='Faite'&&(k.com||[]).some(a=>(a.ment||[]).includes(S.me.id)&&a.par!==S.me.nom);

  <div class="mwrap"><div class="mpop" id="mpop" hidden></div><textarea id="tnote" rows="3" maxlength="2000" placeholder="Écrire un commentaire… tapez @ pour mentionner (Ctrl+Entrée pour envoyer)"></textarea></div><div style="display:flex;justify-content:space-between;margin-top:8px"><button class="btn ghost" id="tat" type="button" style="width:auto">@ Mentionner</button><button class="btn or" id="tcom" type="button" style="width:auto">Commenter</button></div>`}

    close()};

function bindFeed(k){const send=async()=>{const n=$('#tnote');if(!n)return;const txt=n.value.trim();if(!txt)return;
    k.com=(k.com||[]).concat([{id:'…',par:S.me.nom,date:nowStamp(),txt,ment:mentionIdsC(txt)}]);await enqueue('addCommentaire',{tache:k.id,txt});
    $('#tfeed').innerHTML=feedHtml(k);bindFeed(k);const f=$('#fil');if(f)f.scrollTop=f.scrollHeight;toast('Commentaire ajouté'+(S.online?'':' · sera envoyé au retour du réseau'),2000)};
  const n=$('#tnote'),pop=$('#mpop'),P=((S.data.work||{}).people||[]);let act=0,cur=[];
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const closeP=()=>{if(pop){pop.hidden=true;cur=[]}};
  const pick=p=>{const pos=n.selectionStart,b=n.value.slice(0,pos),a=n.value.slice(pos),m=b.match(/(^|\s)@([^\s@]*)$/),ins='@'+p.nom+' ';
    n.value=(m?b.slice(0,b.length-m[0].length)+m[1]:b)+ins+a;const c=(m?b.length-m[0].length+m[1].length:b.length)+ins.length;n.focus();n.setSelectionRange(c,c);closeP()};
  const showP=()=>{if(!n||!pop)return;const m=n.value.slice(0,n.selectionStart).match(/(^|\s)@([^\s@]*)$/);if(!m){closeP();return}
    const q=norm(m[2]);cur=P.filter(p=>p.id!==S.me.id||true).filter(p=>norm(p.nom).includes(q)).slice(0,6);if(!cur.length){closeP();return}
    act=Math.min(act,cur.length-1);pop.innerHTML=cur.map((p,i)=>`<button type="button" data-mi="${i}" class="${i===act?'on':''}">${avatar(p.nom)}<span>${esc(p.nom)} <small>${esc(p.role)}</small></span></button>`).join('');pop.hidden=false;
    pop.querySelectorAll('[data-mi]').forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(cur[+b.dataset.mi])})};
  if($('#tcom'))$('#tcom').onclick=send;
  if($('#tat'))$('#tat').onclick=()=>{const pos=n.selectionStart,b=n.value.slice(0,pos),sp=b&&!/\s$/.test(b)?' ':'';n.value=b+sp+'@'+n.value.slice(pos);const c=pos+sp.length+1;n.focus();n.setSelectionRange(c,c);act=0;showP()};
  if(n){n.oninput=()=>{act=0;showP()};n.onclick=showP;n.onblur=()=>setTimeout(closeP,150);
    n.onkeydown=e=>{if(pop&&!pop.hidden&&cur.length){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=(act+(e.key==='ArrowDown'?1:cur.length-1))%cur.length;showP();return}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(cur[act]);return}if(e.key==='Escape'){e.preventDefault();closeP();return}}
      if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}}}
  const f=$('#fil');if(f)f.scrollTop=f.scrollHeight}

  ${l.ical?`<label class="card static ical"><div class="grow"><b>Synchronisation iCal</b><span class="mute" id="licst">${l.icalActif!==false?'Active : les réservations sont importées automatiquement':'Désactivée : aucune réservation importée, aucune alerte de panne'}</span></div><input type="checkbox" id="lical" role="switch" ${l.icalActif!==false?'checked':''} style="width:24px;height:24px"></label>`:''}
  <h2>Adresse</h2><input class="field" id="ladr" value="${esc(l.adresse)}" style="width:100%">
  <h2>Consignes d'accès</h2><textarea id="lcons">${esc(l.consignes)}</textarea><button class="btn or" id="lsave" style="margin-top:8px">Enregistrer</button>
  <h2>Réservations à venir</h2>${rs.map(r=>`<div class="card static"><div class="grow"><b>${fmtDate(r.start)} → ${fmtDate(r.end)}</b><span class="mute">${esc(r.canal)}${r.voyageur?' · '+esc(r.voyageur):''}${r.caution?' · caution : '+esc(r.caution):''}</span></div></div>`).join('')||'<p class="mute">Aucune.</p>'}
  <h2>Ménages à venir</h2>${ms.map(m=>`<div class="card static"><div class="grow"><b>${esc(m.jour||'')} ${fmtDate(m.date)}</b><span class="mute">${esc(((d.agents||[]).find(g=>g.id===m.agent)||{}).nom||'non affecté')}</span></div>${pill(m.statut)}</div>`).join('')||'<p class="mute">Aucun.</p>'}
  <h2>Interventions ouvertes</h2>${is.map(i=>`<div class="card static"><div class="grow"><b>${esc(i.type)}${i.urgence==='Haute'?' · URGENT':''}</b><span class="mute">${esc(i.description)}</span></div>${pill(i.statut)}</div>`).join('')||'<p class="mute">Aucune.</p>'}</div>`;
  $('#back').onclick=()=>{el.remove();S.view='list';S.detail=null;render()};
  if($('#lical'))$('#lical').onchange=async e=>{const on=e.target.checked;l.icalActif=on;$('#licst').textContent=on?'Active : les réservations sont importées automatiquement':'Désactivée : aucune réservation importée, aucune alerte de panne';
    await enqueue('setIcal',{id:l.id,actif:on});toast(on?'Synchro iCal activée':'Synchro iCal désactivée'+(S.online?'':' · sera envoyé au retour du réseau'),2500)};
  $('#lsave').onclick=async()=>{l.consignes=$('#lcons').value;l.adresse=$('#ladr').value.trim()||l.adresse;
    await enqueue('setConsignes',{id:l.id,consignes:l.consignes,adresse:l.adresse});toast('Enregistré'+(S.online?'':' · sera envoyé au retour du réseau'),3000)}
}

/* ===== Intervenant (Jardin et entretien) : ses interventions ===== */
function jardinList(){
  const d=S.data;if(!d||!d.interventions)return '<main><p class="mute">Chargement…</p></main>';
  return '<main>'+pgHead('Conciergerie · '+fmtDate(d.today),'Mes interventions')+(d.interventions.length?'<div class="tlist">'+d.interventions.map(i=>rowH(i.urgence==='Haute'?'late':i.statut==='En cours'?'today':'soon',`data-iopen="${esc(i.id)}"`,esc(i.logement.nom)+(i.urgence==='Haute'?'<span class="pill p-red">URGENT</span>':''),esc(i.type)+' · '+esc(i.description)+(i.logement.adresse?'<br>'+esc(i.logement.adresse):''),pill(i.statut))).join('')+'</div>':'<div class="empty">Aucune intervention à réaliser.</div>')+'</main>'}
function openIntervention(id){const i=((S.data&&S.data.interventions)||[]).find(x=>x.id===id);if(!i)return;S.detail=i;S.view='detail';paintIntervention()}
function paintIntervention(){
  const d=S.detail,live=d.statut==='En cours',loc=S.localPhotos[d.id]||[];
  let el=$('#sheet');if(!el){el=document.createElement('div');el.id='sheet';el.className='sheet';document.body.appendChild(el)}
  el.innerHTML=`<div class="bar"><button class="x" id="back" aria-label="Fermer">✕</button><h1>${esc(d.logement.nom)}</h1>${pill(d.statut)}</div>
  <div class="body"><div class="card static"><div class="grow"><b>${esc(d.type)}${d.urgence==='Haute'?' · URGENT':''}</b><span class="mute">${esc(d.logement.adresse||'')}</span></div></div>
  <h2>À faire</h2><div class="card static"><div class="grow">${esc(d.description)}</div></div>
  <h2>Accès</h2><div class="card static"><div class="grow">${esc(d.consignes||'Consignes non renseignées')}</div></div>
  <h2>Photos</h2><div class="photos">${loc.map(u=>`<img src="${u}">`).join('')}${d.photos&&!loc.length?`<div class="ph">${d.photos} photo(s)</div>`:''}</div>
  ${live?`<button class="btn ghost" id="addph">Prendre une photo</button><h2>Compte rendu</h2><textarea id="inote" placeholder="Ce qui a été fait (facultatif)">${esc(d.note||'')}</textarea>`:''}</div>
  <div class="foot">${live?'<button class="btn or" id="fin">Terminer</button>':'<button class="btn or" id="start">Démarrer</button>'}</div>`;
  $('#back').onclick=closeSheet;
  if($('#start'))$('#start').onclick=async()=>{d.statut='En cours';await enqueue('startIntervention',{id:d.id});paintIntervention()};
  if($('#addph'))$('#addph').onclick=async()=>{d.note=($('#inote')||{}).value||'';const u=await pickPhoto();if(!u){paintIntervention();return}(S.localPhotos[d.id]=S.localPhotos[d.id]||[]).push(u);d.photos=(d.photos||0)+1;await enqueue('addInterventionPhoto',{id:d.id,data:u});paintIntervention()};
  if($('#fin'))$('#fin').onclick=async()=>{await enqueue('finishIntervention',{id:d.id,note:($('#inote')||{}).value||''});
    S.data.interventions=S.data.interventions.filter(x=>x.id!==d.id);await DB.set('cache',{role:S.me.role,data:S.data});await flush();toast('Intervention terminée');const sh=$('#sheet');if(sh)sh.remove();S.view='list';S.detail=null;render()}
}

/* ===== Incident : logement, photo, description (3 gestes) ===== */
function openIncident(){
  const logs=(S.data&&S.data.logements)||[];
  const pre=S.detail?S.detail.logement.id:(logs[0]&&logs[0].id);
  let photo=null;
  const el=document.createElement('div');el.id='sheet';el.className='sheet';S.view='incident';
  el.innerHTML=`<div class="bar"><button class="x" id="back" aria-label="Fermer">✕</button><h1>Signaler un incident</h1></div>
  <div class="body"><h2>Logement</h2><select class="field" id="ilog">${logs.map(l=>`<option value="${esc(l.id)}" ${l.id===pre?'selected':''}>${esc(l.nom)}</option>`).join('')}</select>
  <h2>Photo</h2><div class="photos" id="iph"></div><button class="btn ghost" id="iadd">Prendre une photo</button>
  <h2>Description</h2><textarea id="idesc" placeholder="Que s'est-il passé ?"></textarea>
  <label class="check"><input type="checkbox" id="iurg"><span>Urgent</span></label></div>
  <div class="foot"><button class="btn or" id="isend">Envoyer</button></div>`;
  document.body.appendChild(el);
  $('#back').onclick=()=>{el.remove();S.view=S.detail?'detail':'list'};
  $('#iadd').onclick=async()=>{const u=await pickPhoto();if(u){photo=u;$('#iph').innerHTML=`<img src="${u}">`}};
  $('#isend').onclick=async()=>{const desc=$('#idesc').value.trim();if(!desc){toast('Décrivez l\'incident');return}
    await enqueue('reportIncident',{logement:$('#ilog').value,description:desc,photo,urgent:$('#iurg').checked});
    el.remove();S.view=S.detail?'detail':'list';toast('Incident enregistré'+(S.online?'':' · sera envoyé au retour du réseau'),3500)}
}

/* ===== Démarrage ===== */
(async function(){
  try{await DB.open()}catch(e){toast('Stockage local indisponible : la saisie hors ligne ne sera pas conservée',6000)}
  const s=await DB.get('session');
  if(s&&Date.now()-s.at<5.5*3600*1000){S.token=s.token;S.me=s.me;render();await refreshPending();loadList();flush()}
  else render();
})();
</script>
</body>
</html>
